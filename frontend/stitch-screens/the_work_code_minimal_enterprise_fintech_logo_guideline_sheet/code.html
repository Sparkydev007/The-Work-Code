<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="background:#FFFFFF; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Background -->
  <rect width="1200" height="900" fill="#FFFFFF"/>

  <!-- Subtle Precision Grid / Guide Accents for Engineered Look -->
  <defs>
    <!-- Master Symbol Mark: Monoline Geometric W + C fused into a Verification Checkmark -->
    <!-- Uniform stroke weight, precision angles, no gradients, clean institutional finish -->
    <g id="twc-mark">
      <!-- Outer/Inner Precision Geometry: W meets C with negative space checkmark -->
      <path d="M -50,-42 L -32,22 L -10,-18 L 8,36 L 46,-36" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="11" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
      <!-- The C enclosure / verification arc contour seamlessly framing and echoing the check apex -->
      <path d="M 28,-42 C 48,-42 62,-26 62,2 C 62,32 46,46 16,46 C -6,46 -24,38 -34,26" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="11" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>

    <!-- Refined Architectural Mark Definition for Perfect Symmetry & Checkmark Fusion -->
    <!-- W on left (down, up, down), rising into confident verification checkmark slash that crowns into the C curve -->
    <g id="work-code-glyph">
      <!-- Geometric W + C stamp -->
      <path d="M 38 78 L 62 136 L 86 92 L 112 148 L 158 48" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="13" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <path d="M 124 50 C 152 46 178 62 178 98 C 178 136 150 154 114 154 C 82 154 58 140 46 122" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="13" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>
  </defs>

  <!-- TOP RIGHT: Alternate Monochrome Variant Box (White mark on #0B1220 ink) -->
  <g transform="translate(930, 70)">
    <rect width="200" height="150" rx="8" fill="#0B1220"/>
    <!-- Subtle technical border -->
    <rect width="200" height="150" rx="8" fill="none" stroke="#1E293B" stroke-width="1"/>
    <!-- Scaled Inverted Mark -->
    <g transform="translate(100, 75) scale(0.65)" color="#FFFFFF">
      <!-- Monoline fused mark -->
      <path d="M -48,-36 L -30,18 L -10,-16 L 8,32 L 44,-32" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="10" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
      <path d="M 26,-36 C 46,-36 58,-22 58,2 C 58,28 42,40 16,40 C -4,40 -20,32 -30,22" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="10" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>
  </g>

  <!-- MAIN HERO SECTION: Large Centered Mark -->
  <g transform="translate(600, 310) scale(2.2)" color="#0B1220">
    <!-- Center Origin Mark -->
    <!-- W Left Stems flowing into dynamic checkmark center with C envelope -->
    <path d="M -56,-44 L -35,22 L -12,-18 L 10,40 L 52,-40" 
          fill="none" 
          stroke="#0B1220" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <path d="M 32,-44 C 54,-44 70,-26 70,4 C 70,36 50,50 18,50 C -6,50 -26,40 -38,26" 
          fill="none" 
          stroke="#0B1220" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Central negative space verification dot / anchor alignment ring (pure vector) -->
  </g>

  <!-- HORIZONTAL DIVIDER / TECHNICAL ALIGNMENT RULE -->
  <line x1="240" y1="550" x2="960" y2="550" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- HORIZONTAL LOCKUP SECTION (Mark + Wordmark) -->
  <g transform="translate(600, 680)">
    <!-- Centering wrapper: Mark width (~90px) + Gap (40px) + Wordmark (~410px) = ~540px total. Offset by -270px -->
    <g transform="translate(-270, 0)">
      <!-- Scaled Mark optically aligned -->
      <g transform="translate(48, 0) scale(0.85)">
        <path d="M -56,-44 L -35,22 L -12,-18 L 10,40 L 52,-40" 
              fill="none" 
              stroke="#0B1220" 
              stroke-width="11" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>
        <path d="M 32,-44 C 54,-44 70,-26 70,4 C 70,36 50,50 18,50 C -6,50 -26,40 -38,26" 
              fill="none" 
              stroke="#0B1220" 
              stroke-width="11" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>
      </g>

      <!-- Wordmark: "THE WORK CODE" in Inter SemiBold, uppercase, letter-spaced, optically centered -->
      <text x="140" y="10" 
            fill="#0B1220" 
            font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-weight="600" 
            font-size="34" 
            letter-spacing="9" 
            alignment-baseline="middle">THE WORK CODE</text>
    </g>
  </g>
</svg>
