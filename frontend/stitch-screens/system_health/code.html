<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>System Health — The Work Code</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/js/twc-api.js"></script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .svc-up { color: #0d9488; background: #f0fdf4; border-color: #bbf7d0; }
  .svc-down { color: #dc2626; background: #fef2f2; border-color: #fecaca; }
  .svc-degraded { color: #d97706; background: #fffbeb; border-color: #fde68a; }
</style>
</head>
<body class="bg-[#f8f9ff] text-[#0b1c30] antialiased">
<div class="max-w-4xl mx-auto px-6 py-10">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">System Health</h1>
      <p class="text-sm text-[#434655]">Aggregated from every microservice actuator endpoint via the gateway.</p>
    </div>
    <div id="overall" class="px-3 py-1.5 rounded-full text-xs font-semibold border">checking…</div>
  </div>
  <div id="services" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
  <p class="text-xs text-[#64748b] mt-6">
    Gateway: <span id="latency">–</span> · checked <span id="checked">–</span>
    · <button class="text-blue-600 hover:underline" onclick="refresh()">Refresh</button>
  </p>
</div>

<script>
  var LABELS = {
    identity: 'Identity Service', employee: 'Employee Service', employer: 'Employer Service',
    employment: 'Employment Service', income: 'Income Service', verification: 'Verification Orchestrator',
    risk: 'Risk Engine', report: 'Report Engine', audit: 'Audit Service',
    batch: 'Batch Service', notification: 'Notification / Webhooks'
  };

  function refresh() {
    fetch(TWC.CONFIG.API_BASE + '/api/health')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        render(data);
      })
      .catch(function () {
        document.getElementById('overall').textContent = 'GATEWAY UNREACHABLE';
        document.getElementById('overall').className = 'px-3 py-1.5 rounded-full text-xs font-semibold border svc-down';
      });
  }

  function render(data) {
    var wrap = document.getElementById('services');
    wrap.innerHTML = '';
    var services = data.services || {};
    Object.keys(services).forEach(function (key) {
      var status = services[key];
      var cls = status === 'UP' ? 'svc-up' : status === 'DOWN' ? 'svc-down' : 'svc-degraded';
      var card = document.createElement('div');
      card.className = 'flex items-center justify-between bg-white border border-[#e2e8f0] rounded-lg px-4 py-3';
      card.innerHTML =
        '<div class="flex items-center gap-3"><span class="material-symbols-outlined text-[18px] text-[#64748b]">dns</span>' +
        '<span class="text-sm font-medium">' + (LABELS[key] || key) + '</span></div>' +
        '<span class="px-2 py-1 rounded text-[10px] font-bold tracking-widest border ' + cls + '">' + status + '</span>';
      wrap.appendChild(card);
    });
    var overall = document.getElementById('overall');
    overall.textContent = data.status === 'UP' ? 'ALL SYSTEMS OPERATIONAL' : data.status;
    overall.className = 'px-3 py-1.5 rounded-full text-xs font-semibold border ' +
      (data.status === 'UP' ? 'svc-up' : 'svc-down');
    document.getElementById('latency').textContent = (data.latencyMs || '–') + ' ms';
    document.getElementById('checked').textContent = new Date(data.checkedAt || Date.now()).toLocaleTimeString();
  }

  document.addEventListener('DOMContentLoaded', refresh);
</script>
</body>
</html>
