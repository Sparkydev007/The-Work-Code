server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: risk-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workcode}
    username: ${SPRING_DATASOURCE_USERNAME:workcode}
    password: ${SPRING_DATASOURCE_PASSWORD:workcode}
    hikari:
      maximum-pool-size: 6
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${SPRING_FLYWAY_SCHEMAS:${spring.application.name}}
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${SPRING_FLYWAY_SCHEMAS:risk-service}
    default-schema: ${SPRING_FLYWAY_SCHEMAS:risk-service}
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

workcode:
  demo-mode: ${DEMO_MODE:true}
  seed-demo-data: ${SEED_DEMO_DATA:true}
